name: paste_button
description: A Flutter widget wrapping iOS 16+ UIPasteControl as a platform view.
version: 0.0.1

environment:
  sdk: ">=3.10.0"
  flutter: ">=3.30.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PasteButtonPlugin
